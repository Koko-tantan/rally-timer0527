<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KvK Rally Timer</title>

<style>
:root{
    color-scheme:dark;
    --bg:#101623;
    --panel:#182132;
    --panel-soft:#202b3d;
    --field:#0f172a;
    --line:#344155;
    --text:#f8fafc;
    --muted:#aab7cb;
    --accent:#38bdf8;
    --accent-strong:#0ea5e9;
    --ok:#34d399;
    --error:#fca5a5;
}

*{
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    margin:0;
    padding:18px;
}

.container{
    max-width:760px;
    margin:0 auto;
}

.app-header{
    margin:4px 0 18px;
}

h1{
    font-size:28px;
    line-height:1.1;
    margin:0 0 6px;
}

.lead{
    color:var(--muted);
    font-size:14px;
    margin:0;
}

.card{
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
}

.clock-panel{
    align-items:center;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:12px;
    display:grid;
    gap:8px;
    justify-items:center;
    padding:16px;
}

.clock-label,
.section-kicker,
.field-label{
    color:var(--muted);
    font-size:13px;
    font-weight:700;
}

.utc-clock{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:40px;
    font-weight:800;
    letter-spacing:0;
    line-height:1;
}

.locked-time{
    color:var(--ok);
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:14px;
    min-height:20px;
}

.section{
    border-top:1px solid var(--line);
    margin-top:18px;
    padding-top:18px;
}

.section:first-of-type{
    border-top:0;
    margin-top:16px;
    padding-top:0;
}

.section-title{
    align-items:baseline;
    display:flex;
    gap:10px;
    justify-content:space-between;
    margin-bottom:12px;
}

.section-title h2,
.section-title h3{
    font-size:18px;
    margin:0;
}

.field{
    margin-bottom:14px;
}

.field-label{
    display:block;
    margin-bottom:6px;
}

.hint{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    margin:6px 0 0;
}

input,
select{
    background:var(--field);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-size:16px;
    min-height:46px;
    outline:none;
    padding:11px 12px;
    width:100%;
}

input:focus,
select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(56,189,248,0.18);
}

button{
    align-items:center;
    border:0;
    border-radius:10px;
    color:white;
    cursor:pointer;
    display:flex;
    font-size:16px;
    font-weight:800;
    justify-content:center;
    min-height:48px;
    padding:12px 14px;
    width:100%;
}

.button-primary{
    background:var(--accent-strong);
}

.button-secondary{
    background:#334155;
}

.button-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
}

.button-row{
    display:grid;
    gap:10px;
    grid-template-columns:1fr 1fr;
}

.member-list{
    display:grid;
    gap:10px;
}

.member-row{
    background:var(--panel-soft);
    border:1px solid var(--line);
    border-radius:12px;
    display:grid;
    gap:10px;
    grid-template-columns:42px 1fr 1fr 112px;
    padding:12px;
}

.member-number{
    align-items:center;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--accent);
    display:flex;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-weight:800;
    justify-content:center;
}

.member-field{
    min-width:0;
}

.member-field input,
.member-field select{
    min-height:42px;
}

.actions{
    display:grid;
    gap:10px;
    grid-template-columns:1fr 1fr;
    margin-top:16px;
}

.error{
    color:var(--error);
    font-size:14px;
    line-height:1.5;
    margin-top:12px;
    min-height:22px;
}

.result{
    background:var(--field);
    border:1px solid var(--line);
    border-radius:12px;
    font-family:"SFMono-Regular",Consolas,monospace;
    line-height:1.7;
    margin-top:10px;
    padding:14px;
}

.result strong{
    color:var(--accent);
}

.empty-state{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin:0;
}

textarea.copy-fallback{
    position:fixed;
    left:-9999px;
    top:0;
}

@media (max-width:640px){
    body{
        padding:12px;
    }

    h1{
        font-size:24px;
    }

    .card{
        border-radius:12px;
        padding:14px;
    }

    .utc-clock{
        font-size:36px;
    }

    .button-row,
    .actions{
        grid-template-columns:1fr;
    }

    .member-row{
        grid-template-columns:36px 1fr;
    }

    .member-field{
        grid-column:1 / -1;
    }

    .member-number{
        grid-column:1;
        grid-row:1;
        min-height:36px;
    }

    .member-name{
        grid-column:2;
        grid-row:1;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="app-header">
    <h1>KvK Rally Timer</h1>
    <p class="lead">着弾UTCから、各メンバーの出撃UTCを早い順に計算します。</p>
</header>

<main>

<section class="card">
    <div class="clock-panel">
        <div class="clock-label">現在UTC</div>
        <div class="utc-clock" id="utcClock">00:00:00</div>
        <button type="button" class="button-ghost" onclick="setCurrentUTC()">このUTCを基準にする</button>
        <div class="locked-time" id="lockedTime">基準UTC: 未設定</div>
    </div>

    <div class="section">
        <div class="section-title">
            <h2>着弾時間</h2>
            <span class="section-kicker">どちらか入力</span>
        </div>

        <div class="field">
            <label class="field-label" for="arrivalTime">着弾UTCを直接入力</label>
            <input type="text" id="arrivalTime" inputmode="text" placeholder="例 12:30:00">
            <p class="hint">ここに入力した場合、下の「集結＋追加時間」より優先されます。</p>
        </div>

        <div class="field">
            <label class="field-label" for="baseRally">基準UTCから計算</label>
            <select id="baseRally">
                <option value="60">1分集結</option>
                <option value="300">5分集結</option>
                <option value="600">10分集結</option>
            </select>
        </div>

        <div class="field">
            <label class="field-label" for="extraTime">追加時間</label>
            <input type="text" id="extraTime" inputmode="text" placeholder="例 2:30">
            <p class="hint">直接入力が空なら、基準UTC + 集結時間 + 追加時間で着弾UTCを作ります。</p>
        </div>
    </div>

    <div class="section">
        <div class="section-title">
            <h2>メンバー</h2>
            <span class="section-kicker">最大30人</span>
        </div>

        <div class="member-list" id="members"></div>

        <button type="button" class="button-secondary" onclick="addMember()">メンバーを追加</button>
    </div>

    <div class="actions">
        <button type="button" class="button-primary" onclick="calculate()">出撃時間を計算</button>
        <button type="button" class="button-secondary" onclick="copyAll()">出撃時間をコピー</button>
    </div>

    <div class="error" id="errorMessage"></div>
</section>

<section class="card">
    <div class="section-title">
        <h2>出撃時間</h2>
        <span class="section-kicker">早い順</span>
    </div>

    <div id="results">
        <p class="empty-state">計算すると、ここに各メンバーの出撃UTCが表示されます。</p>
    </div>
</section>

</main>

</div>

<script>
let memberCount = 0;
let lockedUTC = null;
let latestResults = [];
let isRestoring = false;

const STORAGE_KEY = "kvkRallyTimerStateV1";

function updateClock(){
    const now = new Date();
    const h = String(now.getUTCHours()).padStart(2,"0");
    const m = String(now.getUTCMinutes()).padStart(2,"0");
    const s = String(now.getUTCSeconds()).padStart(2,"0");

    document.getElementById("utcClock").innerText = `${h}:${m}:${s}`;
}

setInterval(updateClock,1000);
updateClock();

function setError(message){
    document.getElementById("errorMessage").innerText = message || "";
}

function setCurrentUTC(){
    const now = new Date();

    lockedUTC =
        now.getUTCHours()*3600 +
        now.getUTCMinutes()*60 +
        now.getUTCSeconds();

    document.getElementById("lockedTime").innerText =
        "基準UTC: " + formatTime(lockedUTC);

    setError("");
    saveState();
}

function addMember(name="", march="", rally="300"){
    if(memberCount >= 30){
        setError("最大30人までです");
        return;
    }

    memberCount++;

    const div = document.createElement("div");
    div.className = "member-row";

    const number = document.createElement("div");
    number.className = "member-number";
    number.innerText = String(memberCount);

    const nameField = document.createElement("div");
    nameField.className = "member-field member-name";

    const nameLabel = document.createElement("label");
    nameLabel.className = "field-label";
    nameLabel.innerText = "名前";

    const nameInput = document.createElement("input");
    nameInput.className = "name";
    nameInput.placeholder = "例 Koko";
    nameInput.value = name;

    const marchField = document.createElement("div");
    marchField.className = "member-field";

    const marchLabel = document.createElement("label");
    marchLabel.className = "field-label";
    marchLabel.innerText = "行軍時間";

    const marchInput = document.createElement("input");
    marchInput.className = "march";
    marchInput.inputMode = "text";
    marchInput.placeholder = "例 1:20";
    marchInput.value = march;

    const rallyField = document.createElement("div");
    rallyField.className = "member-field";

    const rallyLabel = document.createElement("label");
    rallyLabel.className = "field-label";
    rallyLabel.innerText = "集結";

    const rallySelect = document.createElement("select");
    rallySelect.className = "rally";
    rallySelect.innerHTML = `
        <option value="60">1分</option>
        <option value="300">5分</option>
        <option value="600">10分</option>
    `;
    rallySelect.value = rally;

    bindPersist(nameInput);
    bindPersist(marchInput);
    bindPersist(rallySelect);

    nameField.appendChild(nameLabel);
    nameField.appendChild(nameInput);
    marchField.appendChild(marchLabel);
    marchField.appendChild(marchInput);
    rallyField.appendChild(rallyLabel);
    rallyField.appendChild(rallySelect);

    div.appendChild(number);
    div.appendChild(nameField);
    div.appendChild(marchField);
    div.appendChild(rallyField);
    document.getElementById("members").appendChild(div);

    saveState();
}

function parseTime(str, options = {}){
    const allowEmpty = options.allowEmpty !== false;
    const value = String(str || "").trim();

    if(value === ""){
        return allowEmpty ? 0 : null;
    }

    if(!/^\d{1,2}(:\d{1,2}){1,2}$/.test(value)){
        return null;
    }

    const parts = value.split(":").map(Number);

    if(parts.some(Number.isNaN)){
        return null;
    }

    const minutes = parts.length === 2 ? parts[0] : parts[1];
    const seconds = parts.length === 2 ? parts[1] : parts[2];

    if(minutes >= 60 || seconds >= 60){
        return null;
    }

    if(parts.length === 2){
        return parts[0] * 60 + parts[1];
    }

    return parts[0] * 3600 + parts[1] * 60 + parts[2];
}

function formatTime(sec){
    sec = ((sec % 86400) + 86400) % 86400;

    const h = String(Math.floor(sec / 3600)).padStart(2,"0");
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2,"0");
    const s = String(Math.floor(sec % 60)).padStart(2,"0");

    return `${h}:${m}:${s}`;
}

function getCurrentUTCSeconds(){
    const now = new Date();
    return now.getUTCHours()*3600 + now.getUTCMinutes()*60 + now.getUTCSeconds();
}

function calculate(){
    setError("");

    const arrivalInput = document.getElementById("arrivalTime").value.trim();
    let arrival = null;

    if(arrivalInput !== ""){
        arrival = parseTime(arrivalInput, { allowEmpty:false });

        if(arrival === null){
            setError("着弾UTCは 12:30:00 の形式で入力してください");
            return;
        }
    }else{
        const nowUTC = lockedUTC !== null ? lockedUTC : getCurrentUTCSeconds();
        const baseRally = parseInt(document.getElementById("baseRally").value, 10);
        const extra = parseTime(document.getElementById("extraTime").value);

        if(extra === null){
            setError("追加時間は 2:30 または 0:02:30 の形式で入力してください");
            return;
        }

        arrival = nowUTC + baseRally + extra;
    }

    const names = document.querySelectorAll(".name");
    const marches = document.querySelectorAll(".march");
    const rallies = document.querySelectorAll(".rally");

    const results = [];

    for(let i=0;i<names.length;i++){
        const name = names[i].value.trim() || ("Player " + (i+1));
        const march = parseTime(marches[i].value);

        if(march === null){
            setError(`${name} の行軍時間は 1:20 の形式で入力してください`);
            return;
        }

        const rally = parseInt(rallies[i].value, 10) || 300;
        const depart = arrival - rally - march;
        const impact = depart + rally + march;

        results.push({
            name,
            depart,
            impact,
            rally
        });
    }

    results.sort((a,b)=>a.depart-b.depart);
    latestResults = results;
    saveState();

    let html = "";

    results.forEach((r,index)=>{
        html += `
            <div class="result">
                <strong>#${index+1} ${escapeHtml(r.name)}</strong><br>
                出撃UTC: ${formatTime(r.depart)}<br>
                着弾UTC: ${formatTime(r.impact)}<br>
                集結: ${r.rally/60}分
            </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
}

function bindPersist(element){
    element.addEventListener("input", saveState);
    element.addEventListener("change", saveState);
}

function getMembersState(){
    const names = document.querySelectorAll(".name");
    const marches = document.querySelectorAll(".march");
    const rallies = document.querySelectorAll(".rally");
    const members = [];

    for(let i=0;i<names.length;i++){
        members.push({
            name:names[i].value,
            march:marches[i].value,
            rally:rallies[i].value
        });
    }

    return members;
}

function saveState(){
    if(isRestoring){
        return;
    }

    try{
        const state = {
            lockedUTC,
            arrivalTime:document.getElementById("arrivalTime").value,
            baseRally:document.getElementById("baseRally").value,
            extraTime:document.getElementById("extraTime").value,
            members:getMembersState()
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(error){
        setError("入力内容の自動保存に失敗しました");
    }
}

function restoreState(){
    try{
        const raw = localStorage.getItem(STORAGE_KEY);

        if(!raw){
            return false;
        }

        const state = JSON.parse(raw);
        isRestoring = true;

        lockedUTC = Number.isFinite(state.lockedUTC) ? state.lockedUTC : null;
        document.getElementById("arrivalTime").value = state.arrivalTime || "";
        document.getElementById("baseRally").value = state.baseRally || "300";
        document.getElementById("extraTime").value = state.extraTime || "";

        if(lockedUTC !== null){
            document.getElementById("lockedTime").innerText =
                "基準UTC: " + formatTime(lockedUTC);
        }

        document.getElementById("members").innerHTML = "";
        memberCount = 0;

        if(Array.isArray(state.members) && state.members.length > 0){
            state.members.forEach(member=>{
                addMember(member.name || "", member.march || "", member.rally || "300");
            });
        }

        isRestoring = false;
        return true;
    }catch(error){
        isRestoring = false;
        return false;
    }
}

function escapeHtml(value){
    return value.replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"
    }[char]));
}

async function copyAll(){
    if(latestResults.length === 0){
        setError("先に計算してください");
        return;
    }

    let text = "【出撃時間】\n\n";

    const sortedResults = [...latestResults].sort((a,b)=>a.depart-b.depart);

    sortedResults.forEach(r=>{
        text += `${formatTime(r.depart)} ${r.name}\n`;
    });

    try{
        if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(text);
        }else{
            fallbackCopy(text);
        }

        setError("コピーしました");
    }catch(error){
        fallbackCopy(text);
        setError("コピーしました");
    }
}

function fallbackCopy(text){
    const textarea = document.createElement("textarea");
    textarea.className = "copy-fallback";
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);
}

bindPersist(document.getElementById("arrivalTime"));
bindPersist(document.getElementById("baseRally"));
bindPersist(document.getElementById("extraTime"));
window.addEventListener("pagehide", saveState);

if(!restoreState()){
    addMember("Koko","1:20");
    addMember("Beko","1:35");
}
</script>

</body>
</html>

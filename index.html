```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KvK Rally Timer</title>

<style>

body{
    background:#111827;
    color:white;
    font-family:sans-serif;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#1f2937;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

h1{
    text-align:center;
}

.utc-clock{
    text-align:center;
    font-size:32px;
    margin-bottom:20px;
    font-weight:bold;
    font-family:monospace;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:5px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}

.member-row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.result{
    background:#0f172a;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    font-family:monospace;
}

.small{
    font-size:14px;
    opacity:0.8;
    margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>KvK Rally Timer</h1>

<div class="card">

<div>現在UTC時刻</div>
<div class="utc-clock" id="utcClock">00:00:00</div>

<button onclick="setCurrentUTC()">
⏱ 現在UTCをセット
</button>

<div class="small" id="lockedTime">
基準UTC: 未設定
</div>

<label>着弾UTC（直接入力）</label>
<input type="text" id="arrivalTime" placeholder="12:30:00">

<hr style="margin:20px 0; border-color:#374151;">

<label>または 集結＋追加時間で計算</label>

<select id="baseRally">
    <option value="60">1分集結</option>
    <option value="300">5分集結</option>
    <option value="600">10分集結</option>
</select>

<input type="text" id="extraTime" placeholder="追加時間 例 2:30">

<div id="members"></div>

<button onclick="addMember()">＋ メンバー追加</button>

<button onclick="calculate()">計算する</button>

<button onclick="copyAll()">📋 全員コピー</button>

</div>

<div class="card">

<h2>出撃時間</h2>

<div id="results"></div>

</div>

</div>

<script>

let memberCount = 0;
let lockedUTC = null;
let latestResults = [];

function updateClock(){

    const now = new Date();

    const h = String(now.getUTCHours()).padStart(2,"0");
    const m = String(now.getUTCMinutes()).padStart(2,"0");
    const s = String(now.getUTCSeconds()).padStart(2,"0");

    document.getElementById("utcClock").innerText =
        `${h}:${m}:${s}`;
}

setInterval(updateClock,1000);
updateClock();

function setCurrentUTC(){

    const now = new Date();

    lockedUTC =
        now.getUTCHours()*3600 +
        now.getUTCMinutes()*60 +
        now.getUTCSeconds();

    document.getElementById("lockedTime").innerText =
        "基準UTC: " + formatTime(lockedUTC);

    alert("現在UTCをセットしました");
}

function addMember(name="", march=""){

    if(memberCount >= 30){
        alert("最大30人");
        return;
    }

    memberCount++;

    const div = document.createElement("div");
    div.className = "member-row";

    div.innerHTML = `
        <input class="name" placeholder="名前" value="${name}">
        <input class="march" placeholder="行軍時間 m:ss" value="${march}">
        <select class="rally">
            <option value="60">1分</option>
            <option value="300">5分</option>
            <option value="600">10分</option>
        </select>
    `;

    document.getElementById("members").appendChild(div);
}

function parseTime(str){

    if(!str) return 0;

    const parts = str.split(":").map(Number);

    if(parts.length === 2){
        return parts[0] * 60 + parts[1];
    }

    if(parts.length === 3){
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
    }

    return 0;
}

function formatTime(sec){

    sec = ((sec % 86400) + 86400) % 86400;

    const h = String(Math.floor(sec / 3600)).padStart(2,"0");
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2,"0");
    const s = String(Math.floor(sec % 60)).padStart(2,"0");

    return `${h}:${m}:${s}`;
}

function calculate(){

    let arrival =
        parseTime(document.getElementById("arrivalTime").value);

    if(!arrival){

        const nowUTC =
            lockedUTC !== null
            ? lockedUTC
            : (
                new Date().getUTCHours()*3600 +
                new Date().getUTCMinutes()*60 +
                new Date().getUTCSeconds()
            );

        const baseRally =
            parseInt(document.getElementById("baseRally").value);

        const extra =
            parseTime(document.getElementById("extraTime").value);

        arrival =
            nowUTC + baseRally + extra;
    }

    const names = document.querySelectorAll(".name");
    const marches = document.querySelectorAll(".march");
    const rallies = document.querySelectorAll(".rally");

    let results = [];

    for(let i=0;i<names.length;i++){

        const name =
            names[i].value || ("Player " + (i+1));

        const march =
            parseTime(marches[i].value);

        const rally =
            parseInt(rallies[i].value) || 300;

        const depart =
            arrival - rally - march;

        const impact =
            depart + rally + march;

        results.push({
            name,
            depart,
            impact,
            rally
        });
    }

    results.sort((a,b)=>a.impact-b.impact);

    latestResults = results;

    let html = "";

    results.forEach((r,index)=>{

        html += `
            <div class="result">
                <strong>#${index+1} ${r.name}</strong><br>
                出撃UTC: ${formatTime(r.depart)}<br>
                着弾UTC: ${formatTime(r.impact)}<br>
                集結: ${r.rally/60}分
            </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
}

function copyAll(){

    if(latestResults.length === 0){
        alert("先に計算してください");
        return;
    }

    let text = "【連撃】\n\n";

    latestResults.forEach(r=>{

        text +=
            `${formatTime(r.impact)} ${r.name}\n`;
    });

    navigator.clipboard.writeText(text);

    alert("コピーしました");
}

// 初期メンバー
addMember("Koko","1:20");
addMember("Beko","1:35");

</script>

</body>
</html>
```
